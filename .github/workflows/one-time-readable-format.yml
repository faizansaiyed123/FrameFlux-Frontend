name: One-time Readable Formatting

on:
  push:
    branches:
      - format/readable-classnames-80col

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out formatting branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply Prettier formatting
        run: npm run format
      - name: Verify Prettier formatting
        run: npm run format:check
      - name: Verify whitespace
        run: git diff --check
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "No additional formatting changes were needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply readable Prettier formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
